name: Expand Aura site fix 4



on:

  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
        with:
        
          ref: main
          
          fetch-depth: 0
          
      - name: Expand final loader and footer fix
      
        run: |
        
          set -e
          
          unzip -o aura-site-fix4.zip -d .
          
          rm -f aura-site-fix4.zip
          
          rm -f .github/workflows/expand-aura-site-fix4.yml
          
      - name: Commit expanded files
      
        run: |
        
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git diff --cached --quiet && exit 0
          
          git commit -m "Apply loader and footer fixes"
          
          git push origin main
          
























