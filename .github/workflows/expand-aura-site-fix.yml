name: Expand Aura site fix

on:

  workflow_dispatch:
  
permissions:

  contents: write
  
jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Extract site fix bundle
      
        run: |
        
          unzip -oq aura-site-fix.zip -d .
          
          rm -f aura-site-fix.zip
          
          rm -f .github/workflows/expand-aura-site-fix.yml
          
      - name: Commit extracted site fix
      
        run: |
        
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git diff --cached --quiet || git commit -m "Fix contact page, blog imagery, logo, and mobile overflow"
          
          git push
          


















