name: Expand blog archive fix



on:

  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Expand blog fix bundle
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          test -f aura-articles-only.zip
          
          rm -rf /tmp/aura-blog-fix
          
          mkdir -p /tmp/aura-blog-fix
          
          unzip -q aura-articles-only.zip -d /tmp/aura-blog-fix
          
          cp -a /tmp/aura-blog-fix/. .
          
          rm -f aura-articles-only.zip .github/workflows/expand-blog-fix.yml
          
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git commit -m "Fix bilingual blog archive route"
          
          git push
          






















