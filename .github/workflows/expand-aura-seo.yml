name: Expand Aura SEO update

on:

  workflow_dispatch:
  
  push:
  
    paths:
    
      - aura-seo-update.zip
      
permissions:

  contents: write
  
jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Extract SEO bundle
      
        run: |
        
          unzip -o aura-seo-update.zip -d .
          
          rm -f aura-seo-update.zip
          
      - name: Commit extracted files
      
        run: |
        
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git commit -m "Apply bilingual SEO assets and clean sitemap" || echo "No changes to commit"
          
          git push



















