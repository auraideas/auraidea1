name: Expand article bundle



on:

  push:
  
    paths:
    
      - aura-articles-only.zip
      
  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
        with:
        
          fetch-depth: 0
          


      - name: Expand rebuilt articles only
      
        run: |
        
          unzip -o aura-articles-only.zip -d .
          
          rm -f aura-articles-only.zip
          
          rm -f .github/workflows/expand-article-bundle.yml
          
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
          
            echo "No article changes detected"
            
          else
          
            git commit -m "Expand rebuilt HTML articles"
            
            git push origin HEAD:main
            
          fi
          


























